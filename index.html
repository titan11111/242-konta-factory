let AC=null,mg=null,muted=false,stepWait=0,stepN=0;

function audioInit(){
  if(AC)return;
  try{
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();mg=AC.createGain();mg.gain.value=muted?0:.22;mg.connect(AC.destination);
  }catch(e){AC=null;}
}
function unlock(){
  audioInit();
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(f,f2,dur,type,vol,delay){
  if(muted||!AC)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.14,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,hz,delay){
  if(muted||!AC)return;
  const n=Math.max(1,AC.sampleRate*dur|0),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=hz||800;f.Q.value=.85;
  const g=AC.createGain();g.gain.value=vol||.15;
  s.connect(f);f.connect(g);g.connect(mg);s.start(AC.currentTime+(delay||0));
}

let state='title',p,enemies,bullets,waves,parts,booms=[],solids,belts,pools,grids,scans,camX,frame,kills,timer,

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(o){
  o.x+=o.vx;
  const walls=solids.concat(
    enemies.filter(e=>e!==o&&ET[e.t]&&ET[e.t].block&&e.h>24),
    grids.filter(g=>!g.off)
  );
  for(const s of walls){
    if(s.gone>0)continue;
    if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.bump=true;o.vx=0;}
  }
  o.y+=o.vy;o.on=false;
  for(const s of walls){
    if(s.gone>0)continue;
    if(hit(o,s)){if(o.vy>0){o.y=s.y-o.h;o.on=true;}else if(o.vy<0)o.y=s.y+s.h;o.vy=0;}
  }
}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,l:24+Math.random()*12,c,s:3});}
function burstBig(x,y,n){
  const cols=['#fff6d2','#f2c14e','#ff6b6b','#e8762f','#ff8f3a','#f7e6c4'];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,sp=2.4+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.2,l:32+Math.random()*40,c:cols[i%cols.length],s:3+Math.random()*8});
  }
}

  const x=e.x+e.w/2,y=e.y+e.h/2;

// 接地ボスは穴（地面の切れ目・消灯中の格子）に立てない。島の端を壁にする
function floorBands(){
  const raw=[];
  for(const s of solids){
    if(s.gone>0||Math.abs(s.y-GY)>2)continue;
    raw.push({l:s.x,r:s.x+s.w});
  }
  for(const g of grids){
    if(g.off)continue;
    raw.push({l:g.x,r:g.x+g.w});
  }
  raw.sort((a,b)=>a.l-b.l);
  const out=[];
  for(const b of raw){
    const last=out[out.length-1];
    if(last&&b.l<=last.r+1)last.r=Math.max(last.r,b.r);
    else out.push({l:b.l,r:b.r});
  }
  return out;
}
function bossStayOnFloor(e){
  const T=ET[e.t];
  if(!T||!T.boss||!T.ground)return;
  const bands=floorBands();
  if(!bands.length)return;
  const left=e.x, right=e.x+e.w;
  let span=null,bestOv=-1;
  for(const b of bands){
    const ov=Math.min(right,b.r)-Math.max(left,b.l);
    if(ov>bestOv){bestOv=ov;span=b;}
  }
  if(bestOv<=0){
    span=null;
    const cx=(left+right)/2;
    let bd=1e9;
    for(const b of bands){
      const d=cx<b.l?b.l-cx:cx>b.r?cx-b.r:0;
      if(d<bd){bd=d;span=b;}
    }
  }
  if(!span)return;
  const room=span.r-span.l;
  if(e.w>=room)e.x=span.l;
  else{
    if(e.x<span.l){e.x=span.l;if(e.vx<0)e.vx=-e.vx||1;e.bump=true;}
    if(e.x+e.w>span.r){e.x=span.r-e.w;if(e.vx>0)e.vx=-e.vx||-1;e.bump=true;}
  }
  if(e.y>GY-e.h){e.y=GY-e.h;e.vy=0;e.on=true;}
}

// enemies.js から呼ばれる。型テーブルの既定値でオブジェクトを組み立てる
function spawnEnemy(t,x,y,opt){
  const T=ET[t];
  const e=Object.assign({
    t,id:++eid,x,y:(y==null?GY-T.h:y),w:T.w,h:T.h,hp:T.hp,
    vx:0,vy:0,on:false,hitBy:-1,beamBy:-1,fl:0,a:x-70,b:x+70
  },opt||{});
  if(T.spawn)T.spawn(e);
  if(T.boss)bossStayOnFloor(e);
  enemies.push(e);
  return e;
}

function loadStage(ix){
  stage=STAGES[ix];stageIx=ix;LW=stage.len;
  solids=[];
  const holes=(stage.grids||[]).map(([x,w])=>({x,x1:x+w})).sort((a,b)=>a.x-b.x);
  const addG=(a,b)=>{if(b-a>=8)solids.push({x:a,y:GY,w:b-a,h:60});};
  stage.ground.forEach(([a,b])=>{
    let c=a;
    holes.forEach(h=>{
      if(h.x>=b||h.x1<=a)return;
      addG(c,Math.max(a,h.x));c=Math.min(b,h.x1);
    });
    addG(c,b);
  });
  const crumb=stage.crumb||[];
  stage.plats.forEach(([x,y,w])=>solids.push({x,y,w,h:12,crumb:crumb.includes(x),life:0,gone:0}));
  belts=(stage.belts||[]).map(([x,w,dir])=>({x,y:GY,w,dir}));
  pools=(stage.pools||[]).map(([x,w])=>({x,w}));
  grids=(stage.grids||[]).map(([x,w,ph])=>({x,y:GY,w,h:12,ph:ph||0,off:false}));
  scans=(stage.scans||[]).map(s=>({x:s.x,w:s.w,vx:s.vx}));
  enemies=[];eid=0;
  stage.en.forEach(([t,x,y,opt])=>spawnEnemy(t,x,y,opt));
  (stage.drops||[]).forEach(x=>spawnEnemy('scrap',x,-18));
  bullets=[];waves=[];parts=[];booms=[];
  camX=0;timer=0;checkpoint=40;atkId=0;shake=0;flash=0;bossDown=false;
  p.x=40;p.y=GY-p.h;p.vx=0;p.vy=0;p.inv=60;p.atk=0;p.ch=0;p.chMax=0;p.spot=0;
  stepWait=0;stepN=0;
  adrone={x:20,y:GY-72,cd:120,charge:0,fire:0,beamId:0,tgt:null};
}
function newRun(){
  stopEndingVid();
  p={x:40,y:GY-28,w:16,h:28,vx:0,vy:0,on:false,face:1,atk:0,inv:0,hp:3,
     shield:true,shT:0,ch:0,chMax:0,score:0,gait:0,spot:0};
  kills=0;totalKills=0;runTimer=0;
  loadStage(0);
}
newRun();

function anyInput(){
  unlock();
  if(paused)return;
  if(state==='clear'&&!endVidDone){endEndingVid();return;}
  if(state==='clear'&&performance.now()<endRetryAt)return;
  if(state==='title'||state==='over'||state==='clear'){
    if(state!=='title'&&frame<(state==='clear'?110:30))return;
    stopEndingVid();
    newRun();state='intro';frame=0;keys.j=0;keys.a=0;jPrev=1;aPrev=1;
  }else if(state==='intro'&&frame>20){state='play';frame=0;}
}
function startEndingVid(){
  endVidDone=false;endVidOn=false;
  endv.classList.remove('hidden','is-on');
  endv.muted=true;
  try{endv.currentTime=0;}catch(e){}
  const started=endv.play();
  if(started&&typeof started.catch==='function')started.catch(()=>{if(!endVidOn)endEndingVid();});
  clearTimeout(endGuard);
  endGuard=setTimeout(endEndingVid,13000);
}
function endEndingVid(){
  if(endVidDone)return;
  endVidDone=true;endVidOn=false;
  clearTimeout(endGuard);endGuard=0;
  try{endv.pause();}catch(e){}
  endv.classList.remove('is-on');
  if(state==='clear'&&frame<180)frame=180;
  endRetryAt=performance.now()+900;
  setTimeout(()=>{endv.classList.add('hidden');try{endv.currentTime=0;}catch(e){}},280);
}
function stopEndingVid(){
  endVidDone=true;endVidOn=false;
  clearTimeout(endGuard);endGuard=0;
  try{endv.pause();endv.currentTime=0;}catch(e){}
  endv.classList.remove('is-on');endv.classList.add('hidden');
}
endv.addEventListener('ended',endEndingVid);
endv.addEventListener('error',endEndingVid);
endv.addEventListener('timeupdate',()=>{
  if(endVidDone||state!=='clear')return;
  if(endv.currentTime>0.03){
    endv.classList.add('is-on');endVidOn=true;
    endv.muted=!!muted;
  }
});

function damage(e,n,fromX){
  const T=ET[e.t];
  if(e.blast>0)return;                 // 爆発中は撃破カウントを二重に増やさない
  if(T.tough){burst(e.x+e.w/2,e.y+e.h/2,'#8d86a8',4);return;}
  if(T.guard&&T.guard(e,fromX)){e.fl=6;burst(e.x+e.w/2,e.y+e.h/2,'#6fd6c2',5);return;}
  e.hp-=n;e.fl=10;burst(e.x+e.w/2,e.y+e.h/2,'#f7e6c4',6);
  if(e.hp<=0){
    e.dead=true;kills++;totalKills++;
    burst(e.x+e.w/2,e.y+e.h/2,'#ff6b6b',16);
    if(T.boss)bossBoom(e);
    if(T.onDeath)T.onDeath(e);
  }
}
function hurt(from){
  if(p.inv>0)return;
  p.vx=(p.x<from?-3:3);p.vy=-4;
  if(p.shield){p.shield=false;p.shT=480;p.inv=45;shake=4;burst(p.x+8,p.y+10,'#6fd6c2',14);}
  else{p.hp--;p.inv=90;shake=7;burst(p.x+8,p.y+10,'#f2a65a',10);if(p.hp<=0){state='over';frame=0;}}
}

/* ---- ため技（245-raiken-hikari のホールド式を横スクロール用に作り直し） ----
 * 245は「離した瞬間に初めて撃つ」型。242はタップの打感が売りなので、
 * 押した瞬間に通常ヤリを出し、押し続けた分だけ段が上がる二段構えにした。 */
function releaseCharge(){
  const lv=p.ch>=CH_L3?3:(p.ch>=CH_L2?2:0);
  p.ch=0;
  if(!lv)return;
  const d=p.face;
  if(lv===2){
    waves.push({x:p.x+(d>0?p.w:-34),y:p.y+2,w:34,h:24,vx:d*5,dmg:2,lv:2,life:60,hit:{},t:0,trail:[]});
    shake=5;burst(p.x+p.w/2+d*16,p.y+14,'#6fd6c2',12);
  }else{
    waves.push({x:p.x+(d>0?p.w:-56),y:p.y-10,w:56,h:44,vx:d*6.4,dmg:3,lv:3,life:80,hit:{},t:0,trail:[]});
    shake=10;flash=10;burst(p.x+p.w/2+d*20,p.y+12,'#f2c14e',26);burst(p.x+p.w/2,p.y+12,'#f7e6c4',14);
  }
  p.atk=14;atkId++;
  if(navigator.vibrate)navigator.vibrate(lv===3?[18,20,18]:16);
}

/* ---- 攻撃ドローン：ゆっくり敵の頭上へ → 溜め → 真下へビーム ---- */
function updateADrone(){
  const d=adrone;
  if(d.cd>0)d.cd--;
  const top=()=>d.y+8;
  if(d.fire>0){
    if(--d.fire<=0){d.cd=A_COOL;d.tgt=null;}
    return {x:d.x-3,y:top(),w:6,h:GY+24-top()};
  }
  if(d.charge>0){
    if(--d.charge<=0){d.fire=A_FIRE;d.beamId++;burst(d.x,d.y+10,'#f2c14e',8);}
    return null;
  }
  if(d.tgt&&(d.tgt.dead||Math.abs(d.tgt.x-p.x)>A_RANGE+80))d.tgt=null;
  if(!d.tgt&&d.cd<=0){
    let near=1e9;
    for(const e of enemies){
      if(e.dead||ET[e.t].tough)continue;
      const dx=e.x-p.x;
      if(dx<-60||dx>A_RANGE)continue;
      if(Math.abs(dx)<near){near=Math.abs(dx);d.tgt=e;}
    }
  }
  const tx=d.tgt?d.tgt.x+d.tgt.w/2:p.x+p.w/2+p.face*14;
  const ty=d.tgt?Math.max(20,d.tgt.y-46):p.y-30+Math.sin(frame*.06)*3;
  const dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy)||1;
  // 通常は「ゆっくり」。置いていかれたときだけ追いつく速度に上げる
  const sp=Math.abs(d.x-p.x)>320?3.2:A_SPEED;
  const step=Math.min(sp,dist);
  d.x+=dx/dist*step;d.y+=dy/dist*step;
  d.y=Math.max(d.y,20);
  if(d.tgt&&d.cd<=0&&Math.abs(tx-d.x)<4&&Math.abs(ty-d.y)<10)d.charge=A_CHARGE;
  return null;
}

function hiddenUnder(){
  for(const s of solids){
    if(s.h>20||s.gone>0)continue;
    if(p.x+p.w>s.x&&p.x<s.x+s.w&&s.y+s.h<=p.y&&p.y-(s.y+s.h)<70)return true;
  }
  return false;
}
function updateCrumbs(){
  for(const s of solids){
    if(!s.crumb)continue;
    if(s.gone>0){s.gone--;continue;}
    const onThis=p.on&&p.x+p.w>s.x&&p.x<s.x+s.w&&Math.abs(p.y+p.h-s.y)<4;
    if(onThis){s.life++;if(s.life>=22){s.gone=200;s.life=0;burst(s.x+s.w/2,s.y,'#8d86a8',10);}}
    else s.life=Math.max(0,s.life-2);
  }
}
function updateGrids(){
  for(const g of grids){g.ph=(g.ph+1)%180;g.off=g.ph>=100;}
}
function updateScans(){
  if(!scans.length){p.spot=0;return;}
  let seen=false;
  for(const s of scans){
    s.x+=s.vx;
    if(s.x<0||s.x>LW-s.w)s.vx*=-1;
    if(p.x+p.w>s.x&&p.x<s.x+s.w&&!hiddenUnder())seen=true;
  }
  if(seen){
    p.spot=Math.min(30,(p.spot||0)+1);
    if(p.spot===22){
      const s=scans.find(sc=>p.x+p.w>sc.x&&p.x<sc.x+sc.w)||scans[0];
      bullets.push({x:s.x+s.w/2-2,y:6,w:5,h:12,vx:0,vy:5.2,c:'#7fd4ff'});
      p.spot=6;
    }
  }else p.spot=Math.max(0,(p.spot||0)-2);
}

/* ---- 更新 -------------------------------------------------------------- */
function update(){
  frame++;
  if(shake>0)shake*=.85;
  if(flash>0)flash--;
  if(state!=='play')return;
  timer++;runTimer++;

  const wet=p.on&&pools.some(q=>p.x+p.w>q.x&&p.x<q.x+q.w);
  const target=(keys.r-keys.l)*(wet?1.15:2.4);
  if(keys.r&&!keys.l)p.face=1;if(keys.l&&!keys.r)p.face=-1;
  p.vx+=(target-p.vx)*(p.on?.3:.15);
  if(keys.j&&!jPrev&&p.on){p.vy=wet?-6:-9;sfxJump();}
  if(!keys.j&&p.vy<-3)p.vy+=.6;

  // 押した瞬間＝通常ヤリ、押しっぱなし＝ため、離す＝解放
  if(keys.a&&!aPrev){if(p.atk<=0){p.atk=16;atkId++;sfxEi();}p.ch=1;}
  else if(keys.a&&p.ch>0){p.ch=Math.min(CH_MAX,p.ch+1);if(p.ch===CH_L2||p.ch===CH_L3)shake=3;}
  else if(!keys.a&&aPrev&&p.ch>0)releaseCharge();
  p.chMax=Math.max(p.chMax,p.ch);
  jPrev=keys.j;aPrev=keys.a;

  p.vy=Math.min(p.vy+.5,10);
  move(p);if(p.x<0)p.x=0;
  if(p.on){
    for(const b of belts){
      if(p.x+p.w>b.x&&p.x<b.x+b.w&&Math.abs(p.y+p.h-b.y)<3){
        p.x+=b.dir*1.1;
        for(const s of solids)if(hit(p,s)){if(b.dir>0)p.x=s.x-p.w;else p.x=s.x+s.w;}
      }
    }
  }
  if(p.on&&Math.abs(p.vx)>.4){
    p.gait+=Math.abs(p.vx)*.55;
    if(--stepWait<=0){sfxWalk(stepN&1);stepN++;stepWait=9;}
  }else stepWait=Math.min(stepWait,2);
  updateCrumbs();updateGrids();updateScans();
  if(p.atk>0)p.atk--;if(p.inv>0)p.inv--;
  if(!p.shield&&--p.shT<=0){p.shield=true;burst(p.x+8,p.y,'#6fd6c2',8);}
  stage.cps.forEach(c=>{if(p.x>c&&p.on&&c>checkpoint)checkpoint=c;});
  if(p.y>H+40){
    if(p.shield){p.shield=false;p.shT=480;}else p.hp--;
    shake=8;
    if(p.hp<=0){state='over';frame=0;return;}
    p.x=checkpoint;p.y=GY-60;p.vx=0;p.vy=0;p.inv=90;
  }

  const spear=(p.atk>3&&p.atk<13)?{x:p.face>0?p.x+p.w:p.x-30,y:p.y+10,w:30,h:10}:null;
  const beam=updateADrone();

  for(const wv of waves){
    wv.x+=wv.vx;wv.t++;
    wv.trail.unshift(wv.x);if(wv.trail.length>9)wv.trail.pop();
    if(wv.t%3===0)burst(wv.x+(wv.vx>0?0:wv.w),wv.y+wv.h/2,wv.lv===3?'#f2c14e':'#6fd6c2',2);
    if(--wv.life<=0)wv.dead=true;
  }

  for(const e of enemies){
    if(e.dead)continue;
    const T=ET[e.t];
    if(e.fl>0)e.fl--;
    if(T.update)T.update(e);
    if(T.boss)bossStayOnFloor(e);
    if(T.boss&&!e.dead){
      const vis=e.x-camX<W&&e.x-camX+e.w>0;
      if(vis){
        if(!e.seen){e.seen=1;e.vo=e.t==='model3'?54:110;bossSfx(e.t);}
        else if(e.t==='model3'||e.t==='rider'||e.t==='proto004'){
          if(--e.vo<=0){e.vo=e.t==='model3'?54:110;bossSfx(e.t);}
        }
      }
    }
    if(spear&&e.hitBy!==atkId&&hit(spear,e)){e.hitBy=atkId;damage(e,1,p.x);}
    if(beam&&e.beamBy!==adrone.beamId&&hit(beam,e)){e.beamBy=adrone.beamId;damage(e,1,e.x);}
    for(const wv of waves){
      if(wv.dead||wv.hit[e.id])continue;
      if(hit(wv,e)){wv.hit[e.id]=1;damage(e,wv.dmg,wv.x+(wv.vx>0?-1:wv.w+1));}
    }
    const hz=T.hazard&&T.hazard(e);
    if(hz&&hit(p,hz))hurt(hz.x+hz.w/2);
    if(!e.dead&&!T.block&&!T.drop&&hit(p,e))hurt(e.x);
    if(p.spot>12&&e.cd>0&&(e.t==='sniper'||e.t==='warden'||e.t==='rider'))e.cd--;
  }

  for(const b of bullets){
    b.x+=b.vx;
    if(b.vy){b.y+=b.vy;}
    if(b.g)b.vy=(b.vy||0)+b.g;
    if(spear&&hit(spear,b)){b.dead=true;burst(b.x,b.y,'#6fd6c2',4);}
    else if(waves.some(wv=>!wv.dead&&hit(wv,b))){b.dead=true;burst(b.x,b.y,'#f2c14e',4);}
    else if(hit(p,b)){b.dead=true;hurt(b.x);}
    if(Math.abs(b.x-p.x)>420||b.y>H+60)b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
  waves=waves.filter(wv=>!wv.dead&&Math.abs(wv.x-p.x)<440);
  enemies=enemies.filter(e=>!e.dead||e.blast>0);

  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--;}
  parts=parts.filter(q=>q.l>0);
  for(const b of booms){
    b.t++;
    if(b.t===8)burstBig(b.x,b.y,52);
    if(b.t===18)burstBig(b.x,b.y+12,28);
  }
  booms=booms.filter(b=>b.t<b.life);
  camX+=((Math.max(0,Math.min(LW-W,p.x-W/3)))-camX)*.15;

  if(p.x>LW-70){
    if(!bossDown){p.x=LW-86;}
    else if(stageIx<STAGES.length-1){
      loadStage(stageIx+1);state='intro';frame=0;
      p.hp=Math.min(3,p.hp+1);            // ステージ間で1回復（5面を通しで遊べる長さにするため）
    }else{
      state='clear';frame=0;
      const tb=Math.max(0,24000-Math.floor(runTimer/6));
      p.score=totalKills*100+tb+p.hp*300;
      if(p.score>best){best=p.score;try{localStorage.setItem('tg.242.best',best)}catch(e){}}
      startEndingVid();
    }
  }
}

/* ---- 背景（ステージごとに別の場所に見せる） ---------------------------- */
const THEME={
  dusk:{sky:'#2a1840',floor:'#3d2a38',plat:'#4e3848',edge:'#6fd6c2',line:'#6a4558'},
  inside:{sky:'#1d1a2b',floor:'#332c46',plat:'#443a5c',edge:'#f2c14e',line:'#4f4468'},
  lab:{sky:'#10231f',floor:'#1d3a33',plat:'#265046',edge:'#7fe3a8',line:'#2f6455'},
  scrap:{sky:'#141a2e',floor:'#2e3350',plat:'#3d4368',edge:'#b8acd2',line:'#474d72'},
  hitech:{sky:'#0d1a2e',floor:'#1b2e4d',plat:'#26416b',edge:'#7fd4ff',line:'#2f4f7d'}
};

    g.addColorStop(.14,'#2c2150');
    g.addColorStop(.28,'#4a3162');
    g.addColorStop(.42,'#6e4260');
    g.addColorStop(.56,'#9a5458');
    g.addColorStop(.70,'#c46e50');
    g.addColorStop(.84,'#e09458');
    g.addColorStop(1,'#f2c99a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const sx=318-camX*.04,sy=158;
    ctx.fillStyle='rgba(242,201,154,.22)';ctx.beginPath();ctx.arc(sx,sy,64,0,7);ctx.fill();
    ctx.fillStyle='rgba(224,148,88,.28)';ctx.beginPath();ctx.arc(sx,sy,40,0,7);ctx.fill();

    ctx.fillStyle='#16101c';
    for(let i=0;i<12;i++){const x=i*190-(camX*.6)%190-60,h=48+((i*53)%40);ctx.fillRect(x,GY-h,90,h);

  }else if(stage.theme==='inside'){
    // 工場の中：奥の壁・格子窓・天井から下りる配管・ベルトコンベア
    ctx.fillStyle='#262034';ctx.fillRect(0,0,W,GY);
    for(let i=0;i<8;i++){const x=i*180-(camX*.25)%180-60;
      ctx.fillStyle='#31293f';ctx.fillRect(x,30,84,70);
      ctx.fillStyle='#4a3f66';for(let a=0;a<4;a++)ctx.fillRect(x,30+a*18,84,2);
      for(let a=0;a<3;a++)ctx.fillRect(x+a*28,30,2,70);}
    ctx.fillStyle='#3b3350';
    for(let i=0;i<10;i++){const x=i*150-(camX*.5)%150-40;ctx.fillRect(x,0,14,46+((i*29)%40));ctx.fillRect(x-4,42+((i*29)%40),22,8);}
    ctx.fillStyle='#443a5c';ctx.fillRect(0,GY-14,W,6);

    for(let i=0;i<40;i++){const x=(i*26-(camX*1.2)%26);ctx.fillRect(x,GY-13,10,3);}
    ctx.fillStyle='rgba(242,193,78,.06)';ctx.fillRect(0,0,W,GY);
  }else if(stage.theme==='lab'){
    // 地下 人体実験場：培養槽の列とケーブル
    ctx.fillStyle='#152c27';ctx.fillRect(0,0,W,GY);
    for(let i=0;i<9;i++){
      const x=i*160-(camX*.35)%160-50,ht=96,ty=GY-ht-22;
      ctx.fillStyle='#1d3a33';ctx.fillRect(x,ty,50,ht);
      ctx.fillStyle=`rgba(127,227,168,${.16+.06*Math.sin(frame*.04+i)})`;ctx.fillRect(x+4,ty+4,42,ht-8);
      ctx.fillStyle='#0f2622';                       // 槽の中の人影

// 三日月の刃を原点まわりに描く（呼び出し側で translate/scale 済みの前提）
function bladeArc(outer,inner,a){
  ctx.beginPath();
  ctx.arc(0,0,outer,-a,a);
  ctx.arc(0,0,inner,a,-a,true);
  ctx.closePath();
}
function drawWave(wv){
  const d=Math.sign(wv.vx)||1;
  const cy=Math.round(wv.y+wv.h/2);
  const big=wv.lv===3;
  const r=big?34:22,inner=big?19:13,a=big?1.3:1.15;
  const c1=big?'#f2c14e':'#6fd6c2',c2=big?'#ff8f3a':'#2f9e8d';
  // 刃の曲率中心。先端が進行方向を向くよう、鼻先から半径ぶん戻した位置に置く
  const pivot=wx=>Math.round(wx-camX)+(d>0?wv.w:0)-d*r;

  // 残像（軌跡を薄く重ねる）
  for(let i=wv.trail.length-1;i>=1;i--){
    ctx.save();ctx.translate(pivot(wv.trail[i]),cy);ctx.scale(d,1);
    ctx.globalAlpha=.30*(1-i/wv.trail.length);
    ctx.fillStyle=c1;bladeArc(r-i*.6,inner-i*.3,a);ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;

  ctx.save();ctx.translate(pivot(wv.x),cy);ctx.scale(d,1);
  // 外側グロー
  ctx.globalAlpha=.30;ctx.fillStyle=c2;bladeArc(r+6,inner-5,a+.10);ctx.fill();
  // 本体
  ctx.globalAlpha=1;ctx.fillStyle=c1;bladeArc(r,inner,a);ctx.fill();
  // 白熱したコア
  ctx.fillStyle='#f7e6c4';bladeArc(r-2,r-8,a-.14);ctx.fill();
  // 刃を走る放電（MAXのみ）
  if(big){
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    for(let k=0;k<3;k++){
      ctx.beginPath();
      for(let sgi=0;sgi<=7;sgi++){
        const ang=-a+2*a*(sgi/7);
        const rr=inner+(r-inner)*(.18+.66*Math.abs(Math.sin(frame*.55+k*2.1+sgi*1.7)));
        const px=Math.cos(ang)*rr,py=Math.sin(ang)*rr;
        sgi?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.stroke();
    }
  }
  // 発生直後の飛散（放射状に開いて消える）
  if(wv.t<11){
    const k=1-wv.t/11;
    ctx.globalAlpha=k;ctx.strokeStyle=big?'#f7e6c4':'#6fd6c2';ctx.lineWidth=big?3:2;
    for(let i=0;i<=8;i++){
      const ang=-a+2*a*(i/8),ex=r+10+22*(1-k);
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*r,Math.sin(ang)*r);
      ctx.lineTo(Math.cos(ang)*ex,Math.sin(ang)*ex);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // 後ろへ引く速度線
  ctx.globalAlpha=.55;ctx.fillStyle=c1;
  for(let i=0;i<(big?5:3);i++){
    const ly=cy-(big?18:10)+i*(big?9:8);
    const lx=pivot(wv.x)-d*(r+6+((i*13+frame*3)%26));
    ctx.fillRect(d>0?lx-16:lx,ly,16,big?3:2);
  }
  ctx.globalAlpha=1;
}

function drawKontaLegs(phase,air,walking){
  const s=Math.sin(phase);
  let lSwing,rSwing,lLift,rLift;
  if(air){
    const tuck=p.vy<0?3:1;
    lSwing=-3;rSwing=2;lLift=tuck;rLift=tuck+1;
  }else if(!walking){
    lSwing=0;rSwing=0;lLift=0;rLift=0;
  }else{
    lSwing=-Math.max(0,s)*5;rSwing=Math.max(0,-s)*5;
    lLift=Math.max(0,s)*5;rLift=Math.max(0,-s)*5;
  }
  const foot=(fx,fy,lift,swing)=>{
    const x=Math.round(fx+swing),y=Math.round(fy-lift),h=7;
    ctx.fillStyle='#2e7d6f';ctx.fillRect(x,y,5,h);
    ctx.fillStyle='#1a4f44';ctx.fillRect(x,y+h-2,5,2);
  };
  foot(-7,21,lLift,lSwing);foot(2,21,rLift,rSwing);
  return walking?Math.round(Math.abs(s)*1.5):0;
}

    ctx.fillStyle=`rgba(255,46,77,${.05+.05*((i+frame)%3)})`;ctx.fillRect(0,y,W,2+((i*7)%4));}
  if(frame%89<5){ctx.fillStyle='rgba(247,230,196,.12)';ctx.fillRect(0,(frame*13)%H,W,9);}

  hazardBar(30,12,-(frame*.6)%24);
  hazardBar(H-46,12,(frame*.6)%24);

  glitchTxt('コン太と',W/2,84,26,'center');
  glitchTxt('夕焼け廃工場',W/2,116,30,'center');
  txt('N O   F U T U R E   F A C T O R Y',W/2,138,10,'#ff2e4d','center');
  txt('＊  ＊  ＊',W/2,158,10,'#5b4f7a','center');
  if(frame%64<38)txt('［ タップ ／ キー ］',W/2,182,14,'#f2c14e','center');
  if(best)txt(`BEST ${best}`,W/2,H-12,11,'#22e3d0','center');
}

/* ---- ステージ導入 ------------------------------------------------------ */
function drawIntro(){
  ctx.fillStyle='rgba(14,11,20,.82)';ctx.fillRect(0,0,W,H);
  hazardBar(70,10,-(frame*.8)%24);
  hazardBar(H-80,10,(frame*.8)%24);
  txt(`STAGE ${stage.n} / ${STAGES.length}`,W/2,104,13,'#ff2e4d','center');
  glitchTxt(stage.name,W/2,140,26,'center');
  txt(stage.sub,W/2,162,12,'#b8acd2','center');
  if(stage.bossName)txt(stage.bossName,W/2,184,12,'#7fe3a8','center');
  if(frame>20&&frame%54<34)txt('［ タップで進入 ］',W/2,H-22,12,'#f2c14e','center');
}
function drawOver(){
  ctx.fillStyle='rgba(14,11,20,.78)';ctx.fillRect(0,0,W,H);
  for(let i=0;i<4;i++){const y=(frame*5+i*61)%H;ctx.fillStyle='rgba(255,46,77,.1)';ctx.fillRect(0,y,W,4);}
  glitchTxt('機 能 停 止',W/2,118,30,'center');
  txt(`STAGE ${stage.n}　撃破 ${totalKills}`,W/2,150,12,'#b8acd2','center');
  if(frame>30&&frame%56<34)txt('［ タップでリトライ ］',W/2,184,13,'#f2c14e','center');
}

/* ---- エンディング ------------------------------------------------------ */
const ED=['最新研究室の扉が落ちた。',
          '積み上げられていたのは、次のコン太だった。',
          'それでも、外の空はまだ焼けていた。'];
function drawEnding(){
  const f=frame;
  // 夕焼けの空
  ctx.fillStyle='#2b2140';ctx.fillRect(0,0,W,H);
  const bands=[['#3a2a4e',0],['#5b3a52',52],['#8c4a4a',88],['#c9663f',118],['#f2a65a',150]];
  bands.forEach(([c,y])=>{ctx.fillStyle=c;ctx.fillRect(0,y,W,H-y);});
  ctx.fillStyle='#f7e6c4';ctx.beginPath();ctx.arc(330,170,26,0,7);ctx.fill();
  ctx.fillStyle='#241c33';
  for(let i=0;i<10;i++){const x=i*58-10,h=30+((i*47)%56);ctx.fillRect(x,GY-h-18,44,h);
    if(i%2)ctx.fillRect(x+14,GY-h-44,8,28);}
  ctx.fillStyle='#1a1426';ctx.fillRect(0,GY-18,W,H-GY+18);
  // 歩いていく背中（シルエット）
  const wx=Math.min(W+40,40+f*1.05),wy=GY-16;
  ctx.save();ctx.translate(wx,wy);ctx.scale(1.5,1.5);
  ctx.fillStyle='#f2a65a';ctx.globalAlpha=.5;      // 夕日の逆光（背景に沈ませない）
  ctx.beginPath();ctx.ellipse(1,-14,11,17,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#14101c';
  const st=Math.sin(f*.55)*4,tw=Math.sin(f*.7);
  ctx.beginPath();ctx.moveTo(-5,-4);ctx.quadraticCurveTo(-18-tw*3,-2+tw*6,-14+tw*3,-16-tw*7);ctx.lineTo(-6,-6);ctx.fill();
  ctx.fillRect(-5,-10,10,10);
  ctx.fillRect(-5+Math.round(st*.6),Math.round(-Math.max(0,st)),4,8);
  ctx.fillRect(1-Math.round(st*.6),Math.round(-Math.max(0,-st)),4,8);
  ctx.beginPath();ctx.ellipse(0,-16,7,6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,-19);ctx.lineTo(-5,-28);ctx.lineTo(-1,-20);ctx.fill();
  ctx.beginPath();ctx.moveTo(7,-19);ctx.lineTo(5,-28);ctx.lineTo(1,-20);ctx.fill();
  ctx.strokeStyle='#14101c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,4);ctx.lineTo(11,-22);ctx.stroke();
  ctx.restore();
  // 追いていく2機
  [[-26,-40,'#2a2233'],[-44,-52,'#2a2233']].forEach(([ox,oy,c],i)=>{
    const bx=wx+ox-Math.sin(f*.05+i)*3,by=wy+oy+Math.sin(f*.07+i*2)*4;
    ctx.fillStyle=c;ctx.fillRect(bx-7,by,14,6);ctx.fillRect(bx-10,by-3,20,2);
    ctx.fillStyle=i?'#e8762f':'#6fd6c2';ctx.fillRect(bx-2,by+5,4,2);});
  // 白フラッシュ→明ける
  if(f<36){ctx.fillStyle=`rgba(247,230,196,${1-f/36})`;ctx.fillRect(0,0,W,H);}
  // テキスト
  ED.forEach((s,i)=>{
    const t0=55+i*40;
    if(f>t0)txt(s,W/2,44+i*20,13,'#f7e6c4','center');
  });
  if(f>180){
    ctx.fillStyle='rgba(14,11,20,.66)';ctx.fillRect(60,98,W-120,52);
    ctx.fillStyle='#f2c14e';ctx.fillRect(60,98,W-120,2);ctx.fillRect(60,148,W-120,2);
    txt(`SCORE ${p.score}`,W/2,124,17,'#f2c14e','center');
    txt(`撃破 ${totalKills}　タイム ${(runTimer/60).toFixed(1)}秒　BEST ${best}`,W/2,142,11,'#b8acd2','center');
  }
  if(f>230&&f%56<34)txt('［ タップでもう一度 ］',W/2,H-14,12,'#22e3d0','center');
}

/* ---- 描画 -------------------------------------------------------------- */
function draw(){
  ctx.save();
  if(shake>.4)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(state==='title'){drawTitle();ctx.restore();return;}
  if(state==='clear'){drawEnding();ctx.restore();return;}
  drawBG();drawWorld();
  enemies.forEach(e=>!e.dead&&drawEnemy(e));
  bullets.forEach(b=>{ctx.fillStyle=b.c||'#ff6b6b';ctx.fillRect(Math.round(b.x-camX),Math.round(b.y),b.w,b.h);});
  drawADrone();
  waves.forEach(drawWave);
  drawPlayer();
  for(const s of scans){
    const x=Math.round(s.x-camX);if(x>W||x+s.w<0)continue;
    const hot=(p.spot||0)>8;
    ctx.fillStyle=hot?'rgba(255,107,107,.18)':'rgba(127,212,255,.16)';
    ctx.fillRect(x,-4,s.w,GY+8);
    ctx.fillStyle=hot?'#ff6b6b':'#7fd4ff';ctx.fillRect(x,0,2,GY);ctx.fillRect(x+s.w-2,0,2,GY);
    if(hot)ctx.fillRect(x,GY-3,s.w,3);
  }
  booms.forEach(b=>{
    if(b.t<0)return;
    const k=Math.min(1,b.t/b.life),r=14+k*120,sx=b.x-camX;
    ctx.save();ctx.globalAlpha=Math.max(0,1-k)*.75;
    ctx.strokeStyle='#fff6d2';ctx.lineWidth=Math.max(1,5-k*4);
    ctx.beginPath();ctx.arc(sx,b.y,r,0,7);ctx.stroke();
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,b.y,r*.58,0,7);ctx.stroke();
    ctx.fillStyle=`rgba(242,193,78,${Math.max(0,.4-k*.4)})`;
    ctx.beginPath();ctx.arc(sx,b.y,Math.max(2,r*.26),0,7);ctx.fill();
    ctx.restore();
  });
  parts.forEach(q=>{const s=q.s||3;ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x-camX),Math.round(q.y),s,s);});
  if(flash>0){ctx.fillStyle=`rgba(247,230,196,${flash/30})`;ctx.fillRect(0,0,W,H);}
  if(state==='play')drawHUD();
  if(state==='intro')drawIntro();
  if(state==='over')drawOver();
  if(paused){
    ctx.fillStyle='rgba(14,11,20,.78)';ctx.fillRect(0,0,W,H);
    txt('一時停止中',W/2,124,22,'#f7e6c4','center');
    txt('タップして再開',W/2,150,13,'#22e3d0','center');
  }
  ctx.restore();
}
let pauseShown=true;
function syncPauseBtn(){
  const want=(state==='play'||state==='intro');
  if(want!==pauseShown){pauseShown=want;btnPause.style.display=want?'':'none';}
}
let last=performance.now(),acc=0;
function loop(t){
  const dt=t-last;last=t;
  if(!paused){acc+=Math.min(100,dt);while(acc>=16.67){update();acc-=16.67;}}
  draw();
  syncPauseBtn();
  requestAnimationFrame(loop);
}
frame=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
