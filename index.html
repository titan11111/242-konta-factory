<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>コン太と夕焼け廃工場</title>
<meta name="description" content="ヤリのため技と2機のドローンで機械兵30種を薙ぎ倒し、廃工場の5つの区画を抜ける横スクロールアクション。">
<meta property="og:title" content="コン太と夕焼け廃工場">
<meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
<meta property="og:url" content="https://titan11111.github.io/242-konta-factory/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ecf7;--ink:#2b2140;--sub:#5b4f7a;--btn:#e8762f;--btn-ink:#2b2140;--pad:#ddd3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1628;--ink:#f7e6c4;--sub:#b8acd2;--btn:#e8762f;--btn-ink:#1c1628;--pad:#2e2542}}
:root[data-theme="dark"]{--bg:#1c1628;--ink:#f7e6c4;--sub:#b8acd2;--btn:#e8762f;--btn-ink:#1c1628;--pad:#2e2542}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;margin:0;padding:0}
::selection{background:transparent;color:inherit}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",sans-serif}
#game-shell{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) clamp(132px,25vh,210px);padding-top:env(safe-area-inset-top);background:var(--bg)}
#game-stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px 8px}
#screen-wrap{position:relative;width:min(100%,calc((75dvh - env(safe-area-inset-top))*16/9));max-width:960px;aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:6px;background:#2b2140;touch-action:none}
#btn-pause{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#f7e6c4;font-size:16px;z-index:10;touch-action:manipulation}
#control-deck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--pad)}
.grp{display:flex;gap:10px}
.ctrl-btn{font-family:inherit;font-size:1.05rem;border:0;border-radius:14px;min-width:72px;min-height:64px;background:var(--pad);color:var(--ink);touch-action:none;transition:transform .08s ease,filter .08s ease}
.ctrl-btn.act{background:var(--btn);color:var(--btn-ink)}
.ctrl-btn.on{filter:brightness(1.25);transform:scale(.94) translateY(2px)}
.ctrl-btn:focus-visible,#btn-pause:focus-visible{outline:3px solid #6fd6c2;outline-offset:2px}
</style>
</head>
<body>
<div id="game-shell">
  <div id="game-stage">
    <div id="screen-wrap">
      <canvas id="c" aria-label="ゲーム画面"></canvas>
      <button id="btn-pause" aria-label="一時停止">&#10074;&#10074;</button>
    </div>
  </div>
  <div id="control-deck" aria-label="ゲームコントローラ">
    <div class="grp">
      <button class="ctrl-btn" data-k="l" aria-label="左へ移動">&#9664;</button>
      <button class="ctrl-btn" data-k="r" aria-label="右へ移動">&#9654;</button>
    </div>
    <div class="grp">
      <button class="ctrl-btn act" data-k="a" aria-label="ヤリで攻撃">ヤリ</button>
      <button class="ctrl-btn act" data-k="j" aria-label="ジャンプ">ジャンプ</button>
    </div>
  </div>
</div>
<script src="enemies.js"></script>
<script>
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},false);

const W=480,H=270,GY=230;

/* ---- 調整値 ------------------------------------------------------------ */
// 攻撃ドローン：移動0.9px/f=約54px/s（プレイヤー2.4px/fより明確に遅い＝「ゆっくり」）
const A_SPEED=.9,A_RANGE=260,A_CHARGE=26,A_FIRE=18,A_COOL=150;
// ため技：押した瞬間に通常ヤリが出る（打感を落とさない）。押し続けた分だけ段が上がる
const CH_L2=34,CH_L3=82,CH_MAX=96;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;
cv.dataset.logicalWidth=W;cv.dataset.logicalHeight=H;
ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;

const keys={l:0,r:0,j:0,a:0};let jPrev=0,aPrev=0,paused=false;
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j',KeyX:'a',KeyJ:'a'};
addEventListener('keydown',e=>{if(km[e.code]){if(!e.repeat)keys[km[e.code]]=1;e.preventDefault();anyInput();}if(e.code==='KeyP'||e.code==='Escape'){togglePause();}});
addEventListener('keyup',e=>{if(km[e.code]){keys[km[e.code]]=0;}});
document.querySelectorAll('.ctrl-btn[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(err){}keys[k]=1;b.classList.add('on');if(navigator.vibrate)navigator.vibrate(12);anyInput();};
  const off=e=>{keys[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
});
cv.addEventListener('pointerdown',()=>anyInput(true));

const btnPause=document.getElementById('btn-pause');
btnPause.addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause();});
function togglePause(){
  if(state!=='play')return;
  paused=!paused;
  if(paused){keys.l=keys.r=keys.j=keys.a=0;}
  btnPause.innerHTML=paused?'&#9654;':'&#10074;&#10074;';
  btnPause.setAttribute('aria-label',paused?'再開':'一時停止');
}

let best=0;try{best=+localStorage.getItem('tg.242.best')||0}catch(e){}

/* ステージ定義。en の1要素 = [型キー, x, y(null=接地), 追加プロパティ] */
const STAGES=[
{n:1,name:'外周',sub:'夕焼けの廃工場',theme:'dusk',len:2600,
 ground:[[0,700],[754,1500],[1554,2300],[2354,2600]],
 plats:[[420,170,80],[794,140,70],[900,175,90],[1080,130,70],[1290,160,90],[1700,170,80],[1880,125,90],[2394,160,90]],
 cps:[1000,1800],
 en:[['gear',500,null,{a:380,b:660}],['crawler',860,null,{a:800,b:1180}],['bat',1150,100],
     ['gear',1000,null,{a:820,b:1260}],['tur',1350],['hopper',1720],['bat',1950,90],
     ['crawler',1860,null,{a:1650,b:2250}],['tur',2150],['gear',2420,null,{a:2400,b:2560}]]},

{n:2,name:'工場の中',sub:'止まらないベルトと圧搾機',theme:'inside',len:2800,
 ground:[[0,620],[674,1320],[1374,2050],[2104,2800]],
 plats:[[380,168,90],[714,132,70],[840,175,100],[1080,138,80],[1414,170,70],[1560,150,100],[1820,120,80],[2144,168,90],[2320,140,90],[2540,172,80]],
 cps:[900,1800],
 en:[['roller',420,null,{a:330,b:600}],['stacker',700],['charger',980],['spike',1140],
     ['laser',1300,120],['shielder',1480,null,{a:1420,b:1900}],['roller',1750,null,{a:1620,b:2020}],
     ['spike',1960],['stacker',2180],['laser',2340,116],['charger',2520],['shielder',2660,null,{a:2600,b:2780}]]},

{n:3,name:'地下 人体実験場',sub:'培養槽の並ぶ回廊',theme:'lab',len:2800,
 ground:[[0,660],[714,1260],[1314,2000],[2054,2800]],
 plats:[[340,150,80],[450,176,90],[820,134,70],[1000,170,100],[1354,140,80],[1480,172,90],[1700,132,80],[1920,112,90],[2200,146,90],[2440,174,80]],
 cps:[880,1750],
 en:[['swarm',380,150],['swarm',420,120],['swarm',460,168],['shocker',620],['driller',860],
     ['bomber',1060,130],['splitter',1220,null,{a:1140,b:1250}],['mine',1420,150],['mine',1470,110],
     ['driller',1660],['shocker',1880],['splitter',1940,null,{a:1860,b:1960}],
     ['bomber',2260,140],['mine',2420,160],['swarm',2560,130],['swarm',2600,160]]},

{n:4,name:'工場奥の空き地',sub:'捨てられた機体の山',theme:'scrap',len:2900,
 ground:[[0,700],[754,1450],[1504,2200],[2254,2900]],
 plats:[[300,172,90],[500,140,80],[860,176,100],[1120,138,80],[1240,168,90],[1620,130,90],[1900,170,100],[2294,142,80],[2420,172,90],[2650,138,80]],
 cps:[950,1900],
 en:[['hound',420],['blocker',660],['flyer',900,110,{a:820,b:1400}],['leaper',1160],
     ['spinner',1340,120],['magnet',1520],['hound',1760],['blocker',1980],
     ['spinner',2140,106],['flyer',2300,96,{a:2260,b:2860}],['leaper',2460],['magnet',2660],['hound',2800]]},

{n:5,name:'最新研究室',sub:'まだ温かい実験機',theme:'hitech',len:3000,
 ground:[[0,680],[734,1400],[1454,2150],[2204,3000]],
 plats:[[320,150,90],[480,176,80],[820,132,80],[1060,170,100],[1200,138,80],[1560,172,90],[1800,128,90],[1930,166,100],[2320,140,90],[2560,174,80],[2760,136,80]],
 cps:[900,1850],
 en:[['orb',400,110],['sentry',620,90],['warden',880,60],['sniper',1100,120],
     ['mortar',1300],['orb',1520,100],['sentry',1720,84],['warden',1960,58],
     ['sniper',2180,116],['mortar',2400],['orb',2560,120],['overseer',2780,90]]}
];

/* ---- 状態 -------------------------------------------------------------- */
let state='title',p,enemies,bullets,waves,parts,solids,camX,frame,kills,timer,
    checkpoint,atkId,adrone,shake,flash,stage,stageIx,LW,eid,totalKills,runTimer;

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(o){
  o.x+=o.vx;
  for(const s of solids)if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.bump=true;o.vx=0;}
  o.y+=o.vy;o.on=false;
  for(const s of solids)if(hit(o,s)){if(o.vy>0){o.y=s.y-o.h;o.on=true;}else if(o.vy<0)o.y=s.y+s.h;o.vy=0;}
}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,l:24+Math.random()*12,c});}

// enemies.js から呼ばれる。型テーブルの既定値でオブジェクトを組み立てる
function spawnEnemy(t,x,y,opt){
  const T=ET[t];
  const e=Object.assign({
    t,id:++eid,x,y:(y==null?GY-T.h:y),w:T.w,h:T.h,hp:T.hp,
    vx:0,vy:0,on:false,hitBy:-1,beamBy:-1,fl:0,a:x-70,b:x+70
  },opt||{});
  if(T.spawn)T.spawn(e);
  enemies.push(e);
  return e;
}

function loadStage(ix){
  stage=STAGES[ix];stageIx=ix;LW=stage.len;
  solids=[];
  stage.ground.forEach(([a,b])=>solids.push({x:a,y:GY,w:b-a,h:60}));
  stage.plats.forEach(([x,y,w])=>solids.push({x,y,w,h:12}));
  enemies=[];eid=0;
  stage.en.forEach(([t,x,y,opt])=>spawnEnemy(t,x,y,opt));
  bullets=[];waves=[];parts=[];
  camX=0;timer=0;checkpoint=40;atkId=0;shake=0;flash=0;
  p.x=40;p.y=GY-p.h;p.vx=0;p.vy=0;p.inv=60;p.atk=0;p.ch=0;p.chMax=0;
  adrone={x:20,y:GY-72,cd:120,charge:0,fire:0,beamId:0,tgt:null};
}
function newRun(){
  p={x:40,y:GY-28,w:16,h:28,vx:0,vy:0,on:false,face:1,atk:0,inv:0,hp:3,
     shield:true,shT:0,ch:0,chMax:0,score:0};
  kills=0;totalKills=0;runTimer=0;
  loadStage(0);
}
newRun();

function anyInput(){
  if(paused)return;
  if(state==='title'||state==='over'||state==='clear'){
    if(state!=='title'&&frame<(state==='clear'?110:30))return;
    newRun();state='intro';frame=0;keys.j=0;keys.a=0;jPrev=1;aPrev=1;
  }else if(state==='intro'&&frame>20){state='play';frame=0;}
}

function damage(e,n,fromX){
  const T=ET[e.t];
  if(e.blast>0)return;                 // 爆発中は撃破カウントを二重に増やさない
  if(T.tough){burst(e.x+e.w/2,e.y+e.h/2,'#8d86a8',4);return;}
  if(T.guard&&T.guard(e,fromX)){e.fl=6;burst(e.x+e.w/2,e.y+e.h/2,'#6fd6c2',5);return;}
  e.hp-=n;e.fl=10;burst(e.x+e.w/2,e.y+e.h/2,'#f7e6c4',6);
  if(e.hp<=0){
    e.dead=true;kills++;totalKills++;
    burst(e.x+e.w/2,e.y+e.h/2,'#ff6b6b',16);
    if(T.onDeath)T.onDeath(e);
  }
}
function hurt(from){
  if(p.inv>0)return;
  p.vx=(p.x<from?-3:3);p.vy=-4;
  if(p.shield){p.shield=false;p.shT=480;p.inv=45;shake=4;burst(p.x+8,p.y+10,'#6fd6c2',14);}
  else{p.hp--;p.inv=90;shake=7;burst(p.x+8,p.y+10,'#f2a65a',10);if(p.hp<=0){state='over';frame=0;}}
}

/* ---- ため技（245-raiken-hikari のホールド式を横スクロール用に作り直し） ----
 * 245は「離した瞬間に初めて撃つ」型。242はタップの打感が売りなので、
 * 押した瞬間に通常ヤリを出し、押し続けた分だけ段が上がる二段構えにした。 */
function releaseCharge(){
  const lv=p.ch>=CH_L3?3:(p.ch>=CH_L2?2:0);
  p.ch=0;
  if(!lv)return;
  const d=p.face;
  if(lv===2){
    waves.push({x:p.x+(d>0?p.w:-34),y:p.y+2,w:34,h:24,vx:d*5,dmg:2,lv:2,life:60,hit:{}});
    shake=5;
  }else{
    waves.push({x:p.x+(d>0?p.w:-56),y:p.y-10,w:56,h:44,vx:d*6.4,dmg:3,lv:3,life:80,hit:{}});
    shake=10;flash=10;
  }
  p.atk=14;atkId++;
  if(navigator.vibrate)navigator.vibrate(lv===3?[18,20,18]:16);
}

/* ---- 攻撃ドローン：ゆっくり敵の頭上へ → 溜め → 真下へビーム ---- */
function updateADrone(){
  const d=adrone;
  if(d.cd>0)d.cd--;
  const top=()=>d.y+8;
  if(d.fire>0){
    if(--d.fire<=0){d.cd=A_COOL;d.tgt=null;}
    return {x:d.x-3,y:top(),w:6,h:GY+24-top()};
  }
  if(d.charge>0){
    if(--d.charge<=0){d.fire=A_FIRE;d.beamId++;burst(d.x,d.y+10,'#f2c14e',8);}
    return null;
  }
  if(d.tgt&&(d.tgt.dead||Math.abs(d.tgt.x-p.x)>A_RANGE+80))d.tgt=null;
  if(!d.tgt&&d.cd<=0){
    let near=1e9;
    for(const e of enemies){
      if(e.dead||ET[e.t].tough)continue;
      const dx=e.x-p.x;
      if(dx<-60||dx>A_RANGE)continue;
      if(Math.abs(dx)<near){near=Math.abs(dx);d.tgt=e;}
    }
  }
  const tx=d.tgt?d.tgt.x+d.tgt.w/2:p.x+p.w/2+p.face*14;
  const ty=d.tgt?Math.max(20,d.tgt.y-46):p.y-30+Math.sin(frame*.06)*3;
  const dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy)||1;
  // 通常は「ゆっくり」。置いていかれたときだけ追いつく速度に上げる
  const sp=Math.abs(d.x-p.x)>320?3.2:A_SPEED;
  const step=Math.min(sp,dist);
  d.x+=dx/dist*step;d.y+=dy/dist*step;
  if(d.tgt&&d.cd<=0&&Math.abs(tx-d.x)<4&&Math.abs(ty-d.y)<10)d.charge=A_CHARGE;
  return null;
}

/* ---- 更新 -------------------------------------------------------------- */
function update(){
  frame++;
  if(shake>0)shake*=.85;
  if(flash>0)flash--;
  if(state!=='play')return;
  timer++;runTimer++;

  const target=(keys.r-keys.l)*2.4;
  if(keys.r&&!keys.l)p.face=1;if(keys.l&&!keys.r)p.face=-1;
  p.vx+=(target-p.vx)*(p.on?.3:.15);
  if(keys.j&&!jPrev&&p.on)p.vy=-9;
  if(!keys.j&&p.vy<-3)p.vy+=.6;

  // 押した瞬間＝通常ヤリ、押しっぱなし＝ため、離す＝解放
  if(keys.a&&!aPrev){if(p.atk<=0){p.atk=16;atkId++;}p.ch=1;}
  else if(keys.a&&p.ch>0){p.ch=Math.min(CH_MAX,p.ch+1);if(p.ch===CH_L2||p.ch===CH_L3)shake=3;}
  else if(!keys.a&&aPrev&&p.ch>0)releaseCharge();
  p.chMax=Math.max(p.chMax,p.ch);
  jPrev=keys.j;aPrev=keys.a;

  p.vy=Math.min(p.vy+.5,10);
  move(p);if(p.x<0)p.x=0;
  if(p.atk>0)p.atk--;if(p.inv>0)p.inv--;
  if(!p.shield&&--p.shT<=0){p.shield=true;burst(p.x+8,p.y,'#6fd6c2',8);}
  stage.cps.forEach(c=>{if(p.x>c&&p.on&&c>checkpoint)checkpoint=c;});
  if(p.y>H+40){
    if(p.shield){p.shield=false;p.shT=480;}else p.hp--;
    shake=8;
    if(p.hp<=0){state='over';frame=0;return;}
    p.x=checkpoint;p.y=GY-60;p.vx=0;p.vy=0;p.inv=90;
  }

  const spear=(p.atk>3&&p.atk<13)?{x:p.face>0?p.x+p.w:p.x-30,y:p.y+10,w:30,h:10}:null;
  const beam=updateADrone();

  for(const wv of waves){wv.x+=wv.vx;if(--wv.life<=0)wv.dead=true;}

  for(const e of enemies){
    if(e.dead)continue;
    const T=ET[e.t];
    if(e.fl>0)e.fl--;
    if(T.update)T.update(e);
    if(spear&&e.hitBy!==atkId&&hit(spear,e)){e.hitBy=atkId;damage(e,1,p.x);}
    if(beam&&e.beamBy!==adrone.beamId&&hit(beam,e)){e.beamBy=adrone.beamId;damage(e,1,e.x);}
    for(const wv of waves){
      if(wv.dead||wv.hit[e.id])continue;
      if(hit(wv,e)){wv.hit[e.id]=1;damage(e,wv.dmg,wv.x+(wv.vx>0?-1:wv.w+1));}
    }
    const hz=T.hazard&&T.hazard(e);
    if(hz&&hit(p,hz))hurt(hz.x+hz.w/2);
    if(!e.dead&&hit(p,e))hurt(e.x);
  }

  for(const b of bullets){
    b.x+=b.vx;
    if(b.vy){b.y+=b.vy;}
    if(b.g)b.vy=(b.vy||0)+b.g;
    if(spear&&hit(spear,b)){b.dead=true;burst(b.x,b.y,'#6fd6c2',4);}
    else if(waves.some(wv=>!wv.dead&&hit(wv,b))){b.dead=true;burst(b.x,b.y,'#f2c14e',4);}
    else if(hit(p,b)){b.dead=true;hurt(b.x);}
    if(Math.abs(b.x-p.x)>420||b.y>H+60)b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
  waves=waves.filter(wv=>!wv.dead&&Math.abs(wv.x-p.x)<440);
  enemies=enemies.filter(e=>!e.dead||e.blast>0);

  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--;}
  parts=parts.filter(q=>q.l>0);
  camX+=((Math.max(0,Math.min(LW-W,p.x-W/3)))-camX)*.15;

  if(p.x>LW-70){
    if(stageIx<STAGES.length-1){
      loadStage(stageIx+1);state='intro';frame=0;
      p.hp=Math.min(3,p.hp+1);            // ステージ間で1回復（5面を通しで遊べる長さにするため）
    }else{
      state='clear';frame=0;
      const tb=Math.max(0,24000-Math.floor(runTimer/6));
      p.score=totalKills*100+tb+p.hp*300;
      if(p.score>best){best=p.score;try{localStorage.setItem('tg.242.best',best)}catch(e){}}
    }
  }
}

  const bands=[['#3a2a4e',0],['#5b3a52',52],['#8c4a4a',88],['#c9663f',118],['#f2a65a',150]];
  bands.forEach(([c,y])=>{ctx.fillStyle=c;ctx.fillRect(0,y,W,H-y);});
  ctx.fillStyle='#f7e6c4';ctx.beginPath();ctx.arc(330,170,26,0,7);ctx.fill();
  ctx.fillStyle='#241c33';
  for(let i=0;i<10;i++){const x=i*58-10,h=30+((i*47)%56);ctx.fillRect(x,GY-h-18,44,h);
    if(i%2)ctx.fillRect(x+14,GY-h-44,8,28);}
  ctx.fillStyle='#1a1426';ctx.fillRect(0,GY-18,W,H-GY+18);
  // 歩いていく背中（シルエット）
  const wx=Math.min(W+40,40+f*1.05),wy=GY-16;
  ctx.save();ctx.translate(wx,wy);ctx.scale(1.5,1.5);
  ctx.fillStyle='#f2a65a';ctx.globalAlpha=.5;      // 夕日の逆光（背景に沈ませない）
  ctx.beginPath();ctx.ellipse(1,-14,11,17,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#14101c';
  const st=Math.sin(f*.2)*3;
  ctx.fillRect(-5,-10,10,10);ctx.fillRect(-4,0,4,8+st);ctx.fillRect(1,0,4,8-st);
  ctx.beginPath();ctx.ellipse(0,-16,7,6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,-19);ctx.lineTo(-5,-28);ctx.lineTo(-1,-20);ctx.fill();
  ctx.beginPath();ctx.moveTo(7,-19);ctx.lineTo(5,-28);ctx.lineTo(1,-20);ctx.fill();
  ctx.beginPath();ctx.moveTo(-5,-4);ctx.quadraticCurveTo(-17,-1,-13,-14);ctx.fill();
  ctx.strokeStyle='#14101c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,4);ctx.lineTo(11,-22);ctx.stroke();
  ctx.restore();
  // 追いていく2機
  [[-26,-40,'#2a2233'],[-44,-52,'#2a2233']].forEach(([ox,oy,c],i)=>{
    const bx=wx+ox-Math.sin(f*.05+i)*3,by=wy+oy+Math.sin(f*.07+i*2)*4;
    ctx.fillStyle=c;ctx.fillRect(bx-7,by,14,6);ctx.fillRect(bx-10,by-3,20,2);
    ctx.fillStyle=i?'#e8762f':'#6fd6c2';ctx.fillRect(bx-2,by+5,4,2);});
  // 白フラッシュ→明ける
  if(f<36){ctx.fillStyle=`rgba(247,230,196,${1-f/36})`;ctx.fillRect(0,0,W,H);}
  // テキスト
  ED.forEach((s,i)=>{
    const t0=55+i*40;
    if(f>t0)txt(s,W/2,44+i*20,13,'#f7e6c4','center');
  });
  if(f>180){
    ctx.fillStyle='rgba(14,11,20,.66)';ctx.fillRect(60,98,W-120,52);
    ctx.fillStyle='#f2c14e';ctx.fillRect(60,98,W-120,2);ctx.fillRect(60,148,W-120,2);
    txt(`SCORE ${p.score}`,W/2,124,17,'#f2c14e','center');
    txt(`撃破 ${totalKills}　タイム ${(runTimer/60).toFixed(1)}秒　BEST ${best}`,W/2,142,11,'#b8acd2','center');
  }
  if(f>230&&f%56<34)txt('［ タップでもう一度 ］',W/2,H-14,12,'#22e3d0','center');
}

/* ---- 描画 -------------------------------------------------------------- */
function draw(){
  ctx.save();
  if(shake>.4)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(state==='title'){drawTitle();ctx.restore();return;}
  if(state==='clear'){drawEnding();ctx.restore();return;}
  drawBG();drawWorld();
  enemies.forEach(e=>!e.dead&&drawEnemy(e));
  bullets.forEach(b=>{ctx.fillStyle=b.c||'#ff6b6b';ctx.fillRect(Math.round(b.x-camX),Math.round(b.y),b.w,b.h);});
  drawADrone();
  waves.forEach(drawWave);
  drawPlayer();
  parts.forEach(q=>{ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x-camX),Math.round(q.y),3,3);});
  if(flash>0){ctx.fillStyle=`rgba(247,230,196,${flash/30})`;ctx.fillRect(0,0,W,H);}
  if(state==='play')drawHUD();
  if(state==='intro')drawIntro();
  if(state==='over')drawOver();
  if(paused){
    ctx.fillStyle='rgba(14,11,20,.78)';ctx.fillRect(0,0,W,H);
    txt('一時停止中',W/2,124,22,'#f7e6c4','center');
    txt('タップして再開',W/2,150,13,'#22e3d0','center');
  }
  ctx.restore();
}
let pauseShown=true;
function syncPauseBtn(){
  const want=(state==='play'||state==='intro');
  if(want!==pauseShown){pauseShown=want;btnPause.style.display=want?'':'none';}
}
let last=performance.now(),acc=0;
function loop(t){
  const dt=t-last;last=t;
  if(!paused){acc+=Math.min(100,dt);while(acc>=16.67){update();acc-=16.67;}}
  draw();
  syncPauseBtn();
  requestAnimationFrame(loop);
}
frame=0;
requestAnimationFrame(loop);
</script>
</body>
