<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>コン太と夕焼け廃工場</title>
<meta name="description" content="ヤリで機械兵を倒し、ドローンで1回だけダメージを防ぎながらゲートまで走る横スクロールアクション。">
<meta property="og:title" content="コン太と夕焼け廃工場">
<meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
<meta property="og:url" content="https://titan11111.github.io/242-konta-factory/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ecf7;--ink:#2b2140;--sub:#5b4f7a;--btn:#e8762f;--btn-ink:#2b2140;--pad:#ddd3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1628;--ink:#f7e6c4;--sub:#b8acd2;--btn:#e8762f;--btn-ink:#1c1628;--pad:#2e2542}}
:root[data-theme="dark"]{--bg:#1c1628;--ink:#f7e6c4;--sub:#b8acd2;--btn:#e8762f;--btn-ink:#1c1628;--pad:#2e2542}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;margin:0;padding:0}
::selection{background:transparent;color:inherit}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",sans-serif}
#game-shell{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) clamp(132px,25vh,210px);padding-top:env(safe-area-inset-top);background:var(--bg)}
#game-stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px 8px}
#screen-wrap{position:relative;width:min(100%,calc((75dvh - env(safe-area-inset-top))*16/9));max-width:960px;aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:6px;background:#2b2140;touch-action:none}
#btn-pause{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#f7e6c4;font-size:16px;z-index:10;touch-action:manipulation}
#control-deck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--pad)}
.grp{display:flex;gap:10px}
.ctrl-btn{font-family:inherit;font-size:1.05rem;border:0;border-radius:14px;min-width:72px;min-height:64px;background:var(--pad);color:var(--ink);touch-action:none;transition:transform .08s ease,filter .08s ease}
.ctrl-btn.act{background:var(--btn);color:var(--btn-ink)}
.ctrl-btn.on{filter:brightness(1.25);transform:scale(.94) translateY(2px)}
.ctrl-btn:focus-visible,#btn-pause:focus-visible{outline:3px solid #6fd6c2;outline-offset:2px}
</style>
</head>
<body>
<div id="game-shell">
  <div id="game-stage">
    <div id="screen-wrap">
      <canvas id="c" aria-label="ゲーム画面"></canvas>
      <button id="btn-pause" aria-label="一時停止">&#10074;&#10074;</button>
    </div>
  </div>
  <div id="control-deck" aria-label="ゲームコントローラ">
    <div class="grp">
      <button class="ctrl-btn" data-k="l" aria-label="左へ移動">&#9664;</button>
      <button class="ctrl-btn" data-k="r" aria-label="右へ移動">&#9654;</button>
    </div>
    <div class="grp">
      <button class="ctrl-btn act" data-k="a" aria-label="ヤリで攻撃">ヤリ</button>
      <button class="ctrl-btn act" data-k="j" aria-label="ジャンプ">ジャンプ</button>
    </div>
  </div>
</div>
<script>
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},false);

const W=480,H=270,LW=3000,GY=230;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;
cv.dataset.logicalWidth=W;cv.dataset.logicalHeight=H;
ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;

const keys={l:0,r:0,j:0,a:0};let jPrev=0,aPrev=0,paused=false;
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j',KeyX:'a',KeyJ:'a'};
addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=1;e.preventDefault();anyInput();}if(e.code==='KeyP'||e.code==='Escape'){togglePause();}});
addEventListener('keyup',e=>{if(km[e.code]){keys[km[e.code]]=0;}});
document.querySelectorAll('.ctrl-btn[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(err){}keys[k]=1;b.classList.add('on');if(navigator.vibrate)navigator.vibrate(12);anyInput();};
  const off=e=>{keys[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
});
cv.addEventListener('pointerdown',()=>anyInput(true));

const btnPause=document.getElementById('btn-pause');
btnPause.addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true;});
function togglePause(){
  if(state!=='play')return;
  paused=!paused;
  if(paused){keys.l=keys.r=keys.j=keys.a=0;}
  btnPause.innerHTML=paused?'&#9654;':'&#10074;&#10074;';
  btnPause.setAttribute('aria-label',paused?'再開':'一時停止');
}

let best=0;try{best=+localStorage.getItem('tg.242.best')||0}catch(e){}

const solids=[];
[[0,700],[780,1500],[1600,2300],[2380,3000]].forEach(([a,b])=>solids.push({x:a,y:GY,w:b-a,h:60}));
[[420,170,80],[620,140,70],[900,175,90],[1080,130,70],[1440,160,90],[1700,170,80],[1880,125,90],[2250,160,90],[2500,175,80],[2650,135,90]].forEach(([x,y,w])=>solids.push({x,y,w,h:12}));

let state='title',p,enemies,bullets,parts,camX,frame,kills,timer,checkpoint,atkId,msgT;
function reset(){
  p={x:40,y:GY-28,w:16,h:28,vx:0,vy:0,on:false,face:1,atk:0,inv:0,hp:3,shield:true,shT:0};
  enemies=[];
  [[500,380,660],[1000,820,1260],[1850,1650,2250],[2600,2400,2900]].forEach(([x,a,b])=>enemies.push({t:'gear',x,y:GY-20,w:20,h:20,vx:1,vy:0,a,b,hp:2,hitBy:-1,fl:0}));
  [[1150,100],[1950,90],[2720,100]].forEach(([x,y])=>enemies.push({t:'bat',x,y,by:y,w:18,h:12,hp:1,ph:x,hitBy:-1,fl:0}));
  [[1350],[2150],[2830]].forEach(([x])=>enemies.push({t:'tur',x,y:GY-22,w:20,h:22,hp:3,cd:60,hitBy:-1,fl:0}));
  bullets=[];parts=[];camX=0;frame=0;kills=0;timer=0;checkpoint=40;atkId=0;msgT=0;
}
reset();
function anyInput(fromCanvas){
  if(paused)return;
  if(state==='title'||state==='over'||state==='clear'){
    if(state!=='title'&&frame<30)return;
    reset();state='play';keys.j=0;keys.a=0;jPrev=1;aPrev=1;
  }
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(o){
  o.x+=o.vx;
  for(const s of solids)if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.bump=true;o.vx=0;}
  o.y+=o.vy;o.on=false;
  for(const s of solids)if(hit(o,s)){if(o.vy>0){o.y=s.y-o.h;o.on=true;}else if(o.vy<0)o.y=s.y+s.h;o.vy=0;}
}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,l:24+Math.random()*12,c});}
function hurt(from){
  if(p.inv>0)return;
  p.vx=(p.x<from?-3:3);p.vy=-4;
  if(p.shield){p.shield=false;p.shT=480;p.inv=45;burst(p.x+8,p.y+10,'#6fd6c2',14);}
  else{p.hp--;p.inv=90;burst(p.x+8,p.y+10,'#f2a65a',10);if(p.hp<=0){state='over';frame=0;}}
}

function update(){
  frame++;
  if(state!=='play')return;
  timer++;
  const target=(keys.r-keys.l)*2.4;
  if(keys.r&&!keys.l)p.face=1;if(keys.l&&!keys.r)p.face=-1;
  p.vx+=(target-p.vx)*(p.on?.3:.15);
  if(keys.j&&!jPrev&&p.on)p.vy=-9;
  if(!keys.j&&p.vy<-3)p.vy+=.6;
  if(keys.a&&!aPrev&&p.atk<=0){p.atk=16;atkId++;}
  jPrev=keys.j;aPrev=keys.a;
  p.vy=Math.min(p.vy+.5,10);
  move(p);if(p.x<0)p.x=0;
  if(p.atk>0)p.atk--;if(p.inv>0)p.inv--;
  if(!p.shield&&--p.shT<=0){p.shield=true;burst(p.x+8,p.y,'#6fd6c2',8);}
  [40,1250,2050].forEach(c=>{if(p.x>c&&p.on&&c>checkpoint)checkpoint=c;});
  if(p.y>H+40){
    if(p.shield){p.shield=false;p.shT=480;}else p.hp--;
    if(p.hp<=0){state='over';frame=0;return;}
    p.x=checkpoint;p.y=GY-60;p.vx=0;p.vy=0;p.inv=90;
  }
  const spear=(p.atk>3&&p.atk<13)?{x:p.face>0?p.x+p.w:p.x-30,y:p.y+10,w:30,h:10}:null;
  for(const e of enemies){
    if(e.dead)continue;
    if(e.fl>0)e.fl--;
    if(e.t==='gear'){
      e.vy=Math.min(e.vy+.5,10);e.bump=false;
      const dir=Math.sign(e.vx)||1;move(e);e.vx=dir;
      if(e.bump||e.x<e.a||e.x>e.b)e.vx=-dir;
    }else if(e.t==='bat'){
      e.ph+=.04;e.y=e.by+Math.sin(e.ph)*22;
      e.x+=Math.sign(p.x-e.x)*.7*(Math.abs(p.x-e.x)<220?1:0);
    }else{
      if(Math.abs(p.x-e.x)<260&&--e.cd<=0){e.cd=110;const d=Math.sign(p.x-e.x)||1;bullets.push({x:e.x+10+d*12,y:e.y+6,w:6,h:4,vx:d*2.6});}
    }
    if(spear&&e.hitBy!==atkId&&hit(spear,e)){
      e.hitBy=atkId;e.hp--;e.fl=10;burst(e.x+e.w/2,e.y+e.h/2,'#f7e6c4',6);
      if(e.hp<=0){e.dead=true;kills++;burst(e.x+e.w/2,e.y+e.h/2,'#ff6b6b',16);}
    }
    if(!e.dead&&hit(p,e))hurt(e.x);
  }
  for(const b of bullets){
    b.x+=b.vx;
    if(spear&&hit(spear,b)){b.dead=true;burst(b.x,b.y,'#6fd6c2',4);}
    else if(hit(p,b)){b.dead=true;hurt(b.x);}
    if(Math.abs(b.x-p.x)>400)b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--;}
  parts=parts.filter(q=>q.l>0);
  camX+=((Math.max(0,Math.min(LW-W,p.x-W/3)))-camX)*.15;
  if(p.x>2930){
    state='clear';frame=0;
    const score=kills*100+Math.max(0,6000-Math.floor(timer/6))+p.hp*300;
    p.score=score;if(score>best){best=score;try{localStorage.setItem('tg.242.best',best)}catch(e){}}
  }
}

function drawBG(){
  ctx.fillStyle='#2b2140';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f2a65a';ctx.beginPath();ctx.arc(380-camX*.05,70,34,0,7);ctx.fill();
  ctx.fillStyle='#3a2f52';
  for(let i=0;i<14;i++){const x=i*140-(camX*.3)%140-40,h=60+((i*37)%50);ctx.fillRect(x,GY-h-10,70,h+10);ctx.fillRect(x+48,GY-h-40,10,30);}
  ctx.fillStyle='#4a3f66';
  for(let i=0;i<12;i++){const x=i*190-(camX*.6)%190-60,h=40+((i*53)%40);ctx.fillRect(x,GY-h,90,h);
    ctx.fillStyle='#f2c14e';for(let k=0;k<3;k++)if((i+k)%2)ctx.fillRect(x+10+k*26,GY-h+10,8,8);ctx.fillStyle='#4a3f66';}
}
function drawWorld(){
  for(const s of solids){
    const x=Math.round(s.x-camX);if(x>W||x+s.w<0)continue;
    ctx.fillStyle=s.h>20?'#3d3357':'#4a3f66';ctx.fillRect(x,s.y,s.w,s.h);
    ctx.fillStyle='#6fd6c2';ctx.fillRect(x,s.y,s.w,2);
    if(s.h>20){ctx.fillStyle='#5b4f7a';for(let yy=s.y+14;yy<H;yy+=16)ctx.fillRect(x,yy,s.w,2);}
  }
  const gx=2940-camX;
  ctx.fillStyle='#4a3f66';ctx.fillRect(gx,GY-80,8,80);ctx.fillRect(gx+44,GY-80,8,80);ctx.fillRect(gx,GY-86,52,10);
  ctx.fillStyle=`rgba(111,214,194,${.35+.2*Math.sin(frame*.1)})`;ctx.fillRect(gx+8,GY-76,36,76);
  [1250,2050].forEach(c=>{const x=c-camX;ctx.fillStyle=checkpoint>=c?'#6fd6c2':'#5b4f7a';ctx.fillRect(x,GY-30,3,30);ctx.fillRect(x+3,GY-30,12,8);});
}
function drawEnemy(e){
  const x=Math.round(e.x-camX),y=Math.round(e.y);if(x<-30||x>W+30)return;
  const fl=e.fl>0&&e.fl%4<2;
  if(e.t==='gear'){
    ctx.save();ctx.translate(x+10,y+10);ctx.rotate(e.x*.08);
    ctx.fillStyle=fl?'#fff':'#8d86a8';for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(-3,-12,6,5);}
    ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle='#ff6b6b';ctx.fillRect(x+7,y+7,6,6);
  }else if(e.t==='bat'){
    const w=Math.sin(frame*.4)*5;
    ctx.fillStyle=fl?'#fff':'#9b6bd6';
    ctx.beginPath();ctx.moveTo(x+9,y+6);ctx.lineTo(x-6,y+w);ctx.lineTo(x+2,y+10);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+9,y+6);ctx.lineTo(x+24,y+w);ctx.lineTo(x+16,y+10);ctx.fill();
    ctx.fillRect(x+4,y+2,10,9);ctx.fillStyle='#ff6b6b';ctx.fillRect(x+6,y+5,2,2);ctx.fillRect(x+10,y+5,2,2);
  }else{
    const d=Math.sign(p.x-e.x)||1;
    ctx.fillStyle=fl?'#fff':'#6a5f8a';ctx.fillRect(x,y+6,20,16);
    ctx.fillStyle='#8d86a8';ctx.fillRect(d>0?x+14:x-6,y+4,12,5);
    ctx.fillStyle=e.cd<20?'#ff6b6b':'#f2c14e';ctx.fillRect(x+7,y+11,6,6);
  }
}
function drawPlayer(){
  if(p.inv>0&&frame%6<3&&state==='play')return;
  const cx=Math.round(p.x-camX+p.w/2),y=Math.round(p.y);
  ctx.save();ctx.translate(cx,y);ctx.scale(p.face,1);
  const run=p.on&&Math.abs(p.vx)>.5?Math.sin(frame*.4)*2:0;
  ctx.fillStyle='#2e7d6f';ctx.fillRect(-7,21,5,7+run);ctx.fillRect(2,21,5,7-run);
  ctx.fillStyle='#e8762f';ctx.fillRect(-8,11,16,11);
  ctx.fillStyle='#f7e6c4';ctx.fillRect(-5,13,10,6);
  ctx.fillStyle='#6fd6c2';ctx.fillRect(-2,14,4,4);
  ctx.fillStyle='#f7e6c4';ctx.beginPath();ctx.moveTo(-8,20);ctx.quadraticCurveTo(-18,22,-15,12);ctx.lineTo(-9,17);ctx.fill();
  ctx.fillStyle='#e8762f';
  ctx.beginPath();ctx.moveTo(-8,3);ctx.lineTo(-6,-7);ctx.lineTo(-1,1);ctx.fill();
  ctx.beginPath();ctx.moveTo(8,3);ctx.lineTo(6,-7);ctx.lineTo(1,1);ctx.fill();
  ctx.fillStyle='#f7e6c4';ctx.beginPath();ctx.ellipse(0,5,8,7,0,0,7);ctx.fill();
  ctx.fillStyle='#e8762f';ctx.fillRect(-8,-1,16,3);
  ctx.fillStyle='#2b2140';ctx.fillRect(-6,3,13,5);
  ctx.fillStyle='#6fd6c2';ctx.fillRect(-4,4,3,3);ctx.fillRect(2,4,3,3);
  ctx.strokeStyle='#c9c3d6';ctx.lineWidth=2;ctx.beginPath();
  if(p.atk>3&&p.atk<13){const ext=p.atk>8?30:24;ctx.moveTo(-2,15);ctx.lineTo(ext,15);ctx.stroke();
    ctx.fillStyle='#6fd6c2';ctx.beginPath();ctx.moveTo(ext+8,15);ctx.lineTo(ext,11);ctx.lineTo(ext,19);ctx.fill();}
  else{ctx.moveTo(4,24);ctx.lineTo(13,-4);ctx.stroke();ctx.fillStyle='#6fd6c2';ctx.beginPath();ctx.moveTo(15,-10);ctx.lineTo(10,-3);ctx.lineTo(16,-2);ctx.fill();}
  ctx.restore();
  const dx=cx-p.face*20,dy=y-6+Math.sin(frame*.08)*3;
  ctx.save();ctx.translate(dx,dy);
  ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7);}ctx.closePath();
  if(p.shield){ctx.fillStyle='rgba(111,214,194,.45)';ctx.fill();ctx.strokeStyle='#6fd6c2';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#f7e6c4';ctx.fillRect(-1,-1,3,3);}
  else{ctx.strokeStyle='#5b4f7a';ctx.lineWidth=1.5;ctx.stroke();ctx.strokeStyle='#6fd6c2';ctx.beginPath();ctx.arc(0,0,10,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-p.shT/480));ctx.stroke();}
  ctx.restore();
}
function txt(s,x,y,size,c,align){ctx.font=`${size}px "DotGothic16",sans-serif`;ctx.textAlign=align||'left';ctx.fillStyle='#2b2140';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y);}
function drawHUD(){
  for(let i=0;i<3;i++){ctx.fillStyle=i<p.hp?'#ff6b6b':'#4a3f66';const x=10+i*16;ctx.beginPath();ctx.arc(x+3,14,4,0,7);ctx.arc(x+9,14,4,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-1,16);ctx.lineTo(x+6,23);ctx.lineTo(x+13,16);ctx.fill();}
  txt(p.shield?'シールド OK':'シールド 充電中',62,21,11,p.shield?'#6fd6c2':'#b8acd2');
  txt(`撃破 ${kills}`,W-10,21,11,'#f7e6c4','right');
  ctx.fillStyle='#4a3f66';ctx.fillRect(10,H-10,W-20,3);ctx.fillStyle='#6fd6c2';ctx.fillRect(10,H-10,(W-20)*Math.min(1,p.x/2940),3);
}
function draw(){
  drawBG();drawWorld();
  enemies.forEach(e=>!e.dead&&drawEnemy(e));
  ctx.fillStyle='#ff6b6b';bullets.forEach(b=>ctx.fillRect(Math.round(b.x-camX),b.y,b.w,b.h));
  drawPlayer();
  parts.forEach(q=>{ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x-camX),Math.round(q.y),3,3);});
  if(state==='play')drawHUD();
  if(state!=='play'){
    ctx.fillStyle='rgba(43,33,64,.72)';ctx.fillRect(0,0,W,H);
    if(state==='title'){
      txt('コン太と夕焼け廃工場',W/2,92,24,'#f2a65a','center');
      txt('ヤリで機械兵を倒し、ゲートまで走れ',W/2,118,11,'#f7e6c4','center');
      txt('ドローンが1回だけダメージを防ぐ',W/2,134,11,'#b8acd2','center');
      txt('タップ または キーでスタート',W/2,158,13,'#f7e6c4','center');
      txt('←→ 移動　スペース ジャンプ　X ヤリ',W/2,178,10,'#b8acd2','center');
      if(best)txt(`ベスト ${best}`,W/2,198,11,'#6fd6c2','center');
    }
    if(state==='over'){txt('ゲームオーバー',W/2,115,26,'#ff6b6b','center');txt(`撃破 ${kills}　タップでリトライ`,W/2,152,13,'#f7e6c4','center');}
    if(state==='clear'){txt('ステージクリア',W/2,100,26,'#6fd6c2','center');txt(`スコア ${p.score}　ベスト ${best}`,W/2,136,14,'#f7e6c4','center');txt(`タイム ${(timer/60).toFixed(1)}秒　撃破 ${kills}`,W/2,160,12,'#b8acd2','center');txt('タップでもう一回',W/2,190,12,'#f2a65a','center');}
  }
  if(paused){
    ctx.fillStyle='rgba(43,33,64,.72)';ctx.fillRect(0,0,W,H);
    txt('一時停止中',W/2,124,22,'#f7e6c4','center');
    txt('タップして再開',W/2,150,13,'#6fd6c2','center');
  }
}
let last=performance.now(),acc=0;
function loop(t){
  const dt=t-last;last=t;
  if(!paused){acc+=Math.min(100,dt);while(acc>=16.67){update();acc-=16.67;}}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
